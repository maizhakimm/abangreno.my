name: Unpack AbangReno V4

on:
  push:
    branches:
      - rebuild/directory-platform

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/directory-platform
          fetch-depth: 0

      - name: Extract V4 into repository root
        shell: bash
        run: |
          set -euo pipefail
          test -f abangreno-mvp-v4.zip
          rm -rf .unpack-v4
          mkdir .unpack-v4
          unzip -q abangreno-mvp-v4.zip -d .unpack-v4
          test -d .unpack-v4/abangreno
          cp -a .unpack-v4/abangreno/. ./
          rm -rf .unpack-v4

          # Remove files from the old contractor build that conflict with V4.
          rm -f .eslintrc.cjs next.config.ts postcss.config.mjs package-lock.json global.d.ts abangreno-mvp-v4.zip

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: unpack AbangReno directory platform V4"
          git push origin HEAD:rebuild/directory-platform
